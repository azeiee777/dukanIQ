name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      HOSTINGER_APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
      HOSTINGER_PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
      HOSTINGER_PHP_BIN: ${{ secrets.HOSTINGER_PHP_BIN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail

          HOSTINGER_PORT="${HOSTINGER_PORT:-65002}"
          HOSTINGER_PHP_BIN="${HOSTINGER_PHP_BIN:-php}"

          required_values=(
            HOSTINGER_HOST
            HOSTINGER_USERNAME
            HOSTINGER_PASSWORD
            HOSTINGER_APP_PATH
            HOSTINGER_PUBLIC_PATH
          )

          for name in "${required_values[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is missing in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare deploy package
        run: bash scripts/prepare-hostinger-deploy.sh

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Upload release package
        run: |
          set -euo pipefail

          HOSTINGER_PORT="${HOSTINGER_PORT:-65002}"

          sshpass -p "$HOSTINGER_PASSWORD" ssh \
            -p "$HOSTINGER_PORT" \
            -o StrictHostKeyChecking=no \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "mkdir -p \"\$HOME/deploy-temp\""

          sshpass -p "$HOSTINGER_PASSWORD" scp \
            -P "$HOSTINGER_PORT" \
            -o StrictHostKeyChecking=no \
            .deploy/laravel_app.tar.gz \
            .deploy/public_html.tar.gz \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST:deploy-temp/"

      - name: Deploy on Hostinger
        run: |
          set -euo pipefail

          HOSTINGER_PORT="${HOSTINGER_PORT:-65002}"
          HOSTINGER_PHP_BIN="${HOSTINGER_PHP_BIN:-php}"

          sshpass -p "$HOSTINGER_PASSWORD" ssh \
            -p "$HOSTINGER_PORT" \
            -o StrictHostKeyChecking=no \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" <<EOF
          set -euo pipefail

          APP_PATH="$HOSTINGER_APP_PATH"
          PUBLIC_PATH="$HOSTINGER_PUBLIC_PATH"
          PHP_BIN="$HOSTINGER_PHP_BIN"
          TEMP_PATH="\$HOME/deploy-temp"

          mkdir -p \
            "\$APP_PATH" \
            "\$PUBLIC_PATH" \
            "\$APP_PATH/bootstrap/cache" \
            "\$APP_PATH/storage/app/private" \
            "\$APP_PATH/storage/app/public" \
            "\$APP_PATH/storage/framework/cache/data" \
            "\$APP_PATH/storage/framework/sessions" \
            "\$APP_PATH/storage/framework/views" \
            "\$APP_PATH/storage/logs"

          if [ -f "\$APP_PATH/artisan" ]; then
            cd "\$APP_PATH"
            cleanup() {
              "\$PHP_BIN" artisan up || true
            }
            trap cleanup EXIT
            "\$PHP_BIN" artisan down || true
          fi

          rm -rf "\$TEMP_PATH/laravel_app" "\$TEMP_PATH/public_html"
          tar -xzf "\$TEMP_PATH/laravel_app.tar.gz" -C "\$TEMP_PATH"
          tar -xzf "\$TEMP_PATH/public_html.tar.gz" -C "\$TEMP_PATH"

          rm -rf "\$PUBLIC_PATH/build"
          cp -a "\$TEMP_PATH/laravel_app/." "\$APP_PATH/"
          cp -a "\$TEMP_PATH/public_html/." "\$PUBLIC_PATH/"

          if [ -L "\$PUBLIC_PATH/public" ]; then
            rm "\$PUBLIC_PATH/public"
          fi

          ln -sfn "\$APP_PATH/storage/app/public" "\$PUBLIC_PATH/storage"
          chmod -R ug+rw "\$APP_PATH/storage" "\$APP_PATH/bootstrap/cache" || true

          cd "\$APP_PATH"
          "\$PHP_BIN" artisan optimize:clear
          "\$PHP_BIN" artisan migrate --force
          "\$PHP_BIN" artisan config:cache
          "\$PHP_BIN" artisan view:cache
          "\$PHP_BIN" artisan up || true

          rm -rf \
            "\$TEMP_PATH/laravel_app" \
            "\$TEMP_PATH/public_html" \
            "\$TEMP_PATH/laravel_app.tar.gz" \
            "\$TEMP_PATH/public_html.tar.gz"
          EOF
