name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # ─── Validate secrets/vars ────────────────────────────────────────────
      - name: Validate deploy configuration
        run: |
          set -euo pipefail

          missing=()
          [ -z "${{ vars.HOSTINGER_HOST }}" ]         && missing+=("HOSTINGER_HOST")
          [ -z "${{ vars.HOSTINGER_USERNAME }}" ]     && missing+=("HOSTINGER_USERNAME")
          [ -z "${{ vars.HOSTINGER_APP_PATH }}" ]     && missing+=("HOSTINGER_APP_PATH")
          [ -z "${{ vars.HOSTINGER_PUBLIC_PATH }}" ]  && missing+=("HOSTINGER_PUBLIC_PATH")
          [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ]   && missing+=("HOSTINGER_SSH_KEY")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets/variables: ${missing[*]}"
            exit 1
          fi

          echo "✅ All required secrets/variables are set."

      # ─── PHP Setup ───────────────────────────────────────────────────────
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none

      # ─── Node Setup ──────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ─── Install & Build ─────────────────────────────────────────────────
      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ─── Prepare deploy package ──────────────────────────────────────────
      - name: Prepare deploy package
        run: bash scripts/prepare-hostinger-deploy.sh

      # ─── Setup SSH ───────────────────────────────────────────────────────
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ vars.HOSTINGER_HOST }}
          SSH_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Add host to known_hosts (avoid interactive prompt)
          ssh-keyscan -p "${SSH_PORT:-65002}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "✅ SSH configured."

      # ─── Ensure remote directories exist ─────────────────────────────────
      - name: Ensure remote directories exist
        env:
          SSH_HOST: ${{ vars.HOSTINGER_HOST }}
          SSH_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
          SSH_USER: ${{ vars.HOSTINGER_USERNAME }}
          APP_PATH: ${{ vars.HOSTINGER_APP_PATH }}
          PUBLIC_PATH: ${{ vars.HOSTINGER_PUBLIC_PATH }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
              -p "${SSH_PORT:-65002}" \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "$SSH_USER@$SSH_HOST" \
              "mkdir -p \"$APP_PATH\" || true; mkdir -p \"$PUBLIC_PATH\" || true"

          echo "✅ Remote directories confirmed."

      # ─── Enable maintenance mode ─────────────────────────────────────────
      - name: Enable maintenance mode
        env:
          SSH_HOST: ${{ vars.HOSTINGER_HOST }}
          SSH_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
          SSH_USER: ${{ vars.HOSTINGER_USERNAME }}
          APP_PATH: ${{ vars.HOSTINGER_APP_PATH }}
          PHP_BIN: ${{ vars.HOSTINGER_PHP_BIN || 'php' }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
              -p "${SSH_PORT:-65002}" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              "cd \"$APP_PATH\" && [ -f artisan ] && $PHP_BIN artisan down --render='errors::503' || true"

          echo "✅ Maintenance mode enabled (if artisan exists)."

      # ─── Sync Laravel app ────────────────────────────────────────────────
      - name: Sync Laravel application
        env:
          SSH_HOST: ${{ vars.HOSTINGER_HOST }}
          SSH_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
          SSH_USER: ${{ vars.HOSTINGER_USERNAME }}
          APP_PATH: ${{ vars.HOSTINGER_APP_PATH }}
        run: |
          set -euo pipefail

          rsync -az --delete \
            --exclude='.env' \
            --exclude='storage/app' \
            --exclude='storage/framework' \
            --exclude='storage/logs' \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-65002} -o StrictHostKeyChecking=yes" \
            .deploy/laravel_app/ \
            "$SSH_USER@$SSH_HOST:$APP_PATH/"

          echo "✅ Laravel app synced."

      # ─── Sync public files ───────────────────────────────────────────────
      - name: Sync public files
        env:
          SSH_HOST: ${{ vars.HOSTINGER_HOST }}
          SSH_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
          SSH_USER: ${{ vars.HOSTINGER_USERNAME }}
          PUBLIC_PATH: ${{ vars.HOSTINGER_PUBLIC_PATH }}
        run: |
          set -euo pipefail

          rsync -az --delete \
            --exclude='.well-known' \
            --exclude='cgi-bin' \
            --exclude='error_log' \
            --exclude='storage' \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-65002} -o StrictHostKeyChecking=yes" \
            .deploy/public_html/ \
            "$SSH_USER@$SSH_HOST:$PUBLIC_PATH/"

          echo "✅ Public files synced."

      # ─── Finalize on server ──────────────────────────────────────────────
      - name: Finalize remote application
        env:
          SSH_HOST: ${{ vars.HOSTINGER_HOST }}
          SSH_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
          SSH_USER: ${{ vars.HOSTINGER_USERNAME }}
          APP_PATH: ${{ vars.HOSTINGER_APP_PATH }}
          PUBLIC_PATH: ${{ vars.HOSTINGER_PUBLIC_PATH }}
          PHP_BIN: ${{ vars.HOSTINGER_PHP_BIN || 'php' }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
              -p "${SSH_PORT:-65002}" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" << 'ENDSSH'
            set -euo pipefail

            APP_PATH="$APP_PATH"
            PUBLIC_PATH="$PUBLIC_PATH"
            PHP_BIN="$PHP_BIN"

            # Ensure storage dirs exist
            mkdir -p \
              "$APP_PATH/bootstrap/cache" \
              "$APP_PATH/storage/app/private" \
              "$APP_PATH/storage/app/public" \
              "$APP_PATH/storage/framework/cache/data" \
              "$APP_PATH/storage/framework/sessions" \
              "$APP_PATH/storage/framework/views" \
              "$APP_PATH/storage/logs"

            # Symlink storage into public_html
            ln -sfn "$APP_PATH/storage/app/public" "$PUBLIC_PATH/storage"

            # Set permissions
            chmod -R ug+rw "$APP_PATH/storage" "$APP_PATH/bootstrap/cache" || true

            cd "$APP_PATH"

            # Run Laravel post-deploy commands
            "$PHP_BIN" artisan optimize:clear
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache

            # Bring app back up
            "$PHP_BIN" artisan up || true

            echo "✅ Deploy complete!"
          ENDSSH